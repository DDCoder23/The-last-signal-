name: Build CI Report
on:

  workflow_call:

  

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: build
  queue: max
env:
  RUST_PROJECT: server_rust
  DATABASE_Test_PATH: ${{ github.workspace }}/database-test
  DATABASE_Test_URL: sqlite:${{ github.workspace }}/database-test/the_last_signal.db
jobs:

  build:

    name: Build (${{ matrix.os }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      

      - name: Create report
        shell: bash
        run: |
          mkdir -p reports/build-${{ matrix.os }}

          REPORT="reports/build-${{ matrix.os }}/build-${{ matrix.os }}-${GITHUB_RUN_NUMBER}.md"

          echo "REPORT=$REPORT" >> $GITHUB_ENV

          {
            echo "# Build Report"
            echo ""
            echo "Run : ${GITHUB_RUN_NUMBER}"
            echo "OS : ${{ matrix.os }}"
            echo "Branch : ${GITHUB_REF_NAME}"
            echo "Commit : ${GITHUB_SHA}"
            echo "Date : $(date)"
            echo ""
          } > "$REPORT"

      - name: Python build
        continue-on-error: true
        shell: bash
        run: |
          {
            echo ""
            echo "## Python"
          } >> "$REPORT"

          python -m compileall client_python tests >> "$REPORT" 2>&1

      - name: Rust build
        continue-on-error: true
        shell: bash
        run: |
          {
            echo ""
            echo "## Rust"
          } >> "$REPORT"

          if find . -name Cargo.toml | grep -q .; then
            cargo build --manifest-path "$RUST_PROJECT/Cargo.toml" \
             --release>> "$REPORT" 2>&1
          else
            echo "No Rust project found." >> "$REPORT"
          fi

      - name: Godot build
        continue-on-error: true
        shell: bash
        run: |
          {
            echo ""
            echo "## Godot"
          } >> "$REPORT"

          if [ -f project.godot ]; then
            echo "Godot export not configured yet." >> "$REPORT"
          else
            echo "No Godot project found." >> "$REPORT"
          fi

      - name: Build Summary
        shell: bash
        run: |
          {
            echo ""
            echo "## Summary"
            echo ""
            echo "- Python build completed"
            echo "- Rust build completed"
            echo "- Godot build completed"
          } >> "$REPORT"

      - name: Publish Summary
        shell: bash
        run: |
          cat "$REPORT" >> $GITHUB_STEP_SUMMARY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-report-${{ matrix.os }}
          path: |
            reports/**
          if-no-files-found: warn
      - name: 💾 Commit reports
        uses: ./.github/actions/commit-reports
        with:
          report-type: build
          commit-message: "Build Report #${{ github.run_number }}"

  
