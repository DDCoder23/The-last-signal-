name: Sync CI Data to Main

on:
  workflow_dispatch:
  workflow_call:

  
permissions:
  contents: write
  pull-requests: write

jobs:

  sync:

    runs-on: ubuntu-latest
    env:
       GH_TOKEN: ${{ github.token }}

    steps:

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      #######################################################
      # Reports
      #######################################################

      - name: Download ci-reports
        run: |

          git fetch origin ci-reports

          mkdir ci-reports-temp

          git --work-tree=ci-reports-temp checkout origin/ci-reports -- .

          mkdir -p reports dashboard

          cp -r ci-reports-temp/reports/* reports/ 2>/dev/null || true
          cp -r ci-reports-temp/dashboard/* dashboard/ 2>/dev/null || true

      #######################################################
      # Databases
      #######################################################

      - name: Download ci-database
        run: |
            set -e

            git fetch origin ci-database

            rm -rf ci-database-temp
            mkdir -p ci-database-temp

            git archive origin/ci-database | tar -x -C ci-database-temp

            DB_SOURCE="ci-database-temp/database/the_last_signal.db"
            DB_TARGET="database/the_last_signal.db"

            if [ ! -f "$DB_SOURCE" ]; then
            echo "::error::Database introuvable"
            exit 1
            fi

            echo "=== Intégrité de la base source ==="
            sqlite3 "$DB_SOURCE" "PRAGMA integrity_check;"

            INTEGRITY=$(sqlite3 "$DB_SOURCE" "PRAGMA integrity_check;")

            if [ "$INTEGRITY" != "ok" ]; then
            echo "::error::La base source est CORROMPUE"
            exit 1
            fi

            mkdir -p database
            cp "$DB_SOURCE" "$DB_TARGET"

            echo "=== Intégrité de la copie ==="
            INTEGRITY=$(sqlite3 "$DB_TARGET" "PRAGMA integrity_check;")

            if [ "$INTEGRITY" != "ok" ]; then
            echo "::error::La copie est CORROMPUE"
            exit 1
            fi

            echo "✓ Base SQLite valide"
      #######################################################
      # Commit
      #######################################################

      - name: Commit changes
        run: |

          git add reports database
          git status --short
          git diff --cached --stat

          git commit -m "Synchronize CI data #${GITHUB_RUN_NUMBER}" || echo "Nothing to commit"
          
            for i in 1 2 3
            do
            echo "Tentative $i/3"
            git fetch origin main

            if ! git rebase "origin/main"
            then
            echo "Rebase impossible."
            git rebase --abort || true
            break
            fi

            echo "Branche actuelle :"
            git branch --show-current

            git status

            if git push origin HEAD:main
            then
            echo "Push réussi"


            exit 0
            fi

            echo "Push échoué."
            sleep 2
            done

            echo "======================================"
            echo "Push direct impossible"
            echo "Création de la branche de secours"
            echo "======================================"

            FALLBACK_BRANCH="main-update"

            echo "Branche de secours : $FALLBACK_BRANCH"

            # Crée ou met à jour la branche de secours
            git push --force origin HEAD:"refs/heads/$FALLBACK_BRANCH"

             
            echo "Branche de secours poussée."

            # Vérifie si une PR existe déjà
            PR_URL=$(gh pr list \
             --base main \
             --head "$FALLBACK_BRANCH" \
             --state open \
             --json url \
             --jq '.[0].url')

             if [ -n "$PR_URL" ]; then
             echo "Une Pull Request existe déjà : $PR_URL"
             else
             echo "Création de la Pull Request..."
             

            gh pr create \
              --base main \
              --head "$FALLBACK_BRANCH" \
              --title "Synchronize CI data #${GITHUB_RUN_NUMBER}" \
              --body "Le push direct vers main a échoué après 3 tentatives. Les changements générés par GitHub Actions sont disponibles dans cette Pull Request."
             fi

            
