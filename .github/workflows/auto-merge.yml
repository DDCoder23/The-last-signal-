name: Dependabot Auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: >
      github.repository == 'DDCoder23/The-last-signal-' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}

    steps:
      - name: Display PR information
        run: |
          echo "======================================"
          echo "Dependabot PR détectée"
          echo "======================================"
          echo "PR     : #$PR_NUMBER"
          echo "Titre  : $PR_TITLE"
          echo "URL    : $PR_URL"
          echo "Base   : main"
          echo "======================================"

      - name: Approve Dependabot PR
        run: |
          set -euo pipefail

          echo "Approbation automatique de la PR..."

          gh pr review "$PR_URL" \
            --approve

          echo "PR approuvée."

      - name: Enable auto-merge
        run: |
          set -euo pipefail

          echo "Activation de l'auto-merge..."

          gh pr merge "$PR_URL" \
            --auto \
            --squash

          echo "Auto-merge activé."
          echo "La PR sera fusionnée lorsque toutes les conditions requises seront satisfaites."
