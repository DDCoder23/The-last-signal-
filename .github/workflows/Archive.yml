name: Archive CI Reports

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    env:
      REPORTS_DIR: reports
      ARCHIVE_DIR: archive
      KEEP_REPORTS: 3

    steps:
      - name: Checkout ci-reports
        uses: actions/checkout@v4
        with:
          ref: ci-reports
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Archive old reports
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$ARCHIVE_DIR"

          shopt -s nullglob

          for DIR in "$REPORTS_DIR"/*; do
            [ -d "$DIR" ] || continue

            NAME=$(basename "$DIR")
            ZIP_FILE="$ARCHIVE_DIR/${NAME}.zip"

            mapfile -t FILES < <(
              find "$DIR" -maxdepth 1 -type f -name "*.md" \
                -printf "%T@ %p\n" |
              sort -nr |
              cut -d' ' -f2-
            )

            COUNT=${#FILES[@]}

            if (( COUNT <= KEEP_REPORTS )); then
              echo "::notice::$NAME : rien à archiver ($COUNT rapport(s))"
              continue
            fi

            echo "Archivage des anciens rapports de $NAME"

            TMP_DIR=$(mktemp -d)

            for FILE in "${FILES[@]:KEEP_REPORTS}"; do
              cp "$FILE" "$TMP_DIR/"
            done

            (
              cd "$TMP_DIR"

              if [ -f "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
                zip -q -u "$GITHUB_WORKSPACE/$ZIP_FILE" *.md
              else
                zip -q -9 "$GITHUB_WORKSPACE/$ZIP_FILE" *.md
              fi
            )

            for FILE in "${FILES[@]:KEEP_REPORTS}"; do
              rm -f "$FILE"
            done

            rm -rf "$TMP_DIR"
          done

      - name: Commit changes
        shell: bash
        run: |
          git add archive reports

          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git commit -m "Archive old CI reports"

          git pull --rebase origin ci-reports

          git push origin ci-reports
