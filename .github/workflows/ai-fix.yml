name: AI Fix

on:
  workflow_call:
    inputs:
      error-artifact:
        description: "Nom de l'artifact contenant l'erreur"
        required: true
        type: string
      command:
        description: "Commande qui a échoué"
        required: true
        type: string

      working-directory:
        description: "Répertoire de travail"
        required: false
        type: string
        default: "server_rust"

permissions:
  contents: read

jobs:
  analyze:
  name: AI Fix Rust
  runs-on: ubuntu-latest
  timeout-minutes: 180
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Download error artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.error-artifact }}
        path: ai-input

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          cmake \
          git \
          curl \
          jq \
        patch

    - name: Install llama.cpp
      shell: bash
      run: |
        set -euo pipefail

        echo "Clonage de llama.cpp..."

        rm -rf "$HOME/llama.cpp"

        git clone \
        --depth 1 \
        https://github.com/ggml-org/llama.cpp.git \
        "$HOME/llama.cpp"

        echo "Compilation de llama-cli..."

        cmake \
        -S "$HOME/llama.cpp" \
        -B "$HOME/llama.cpp/build" \
        -DCMAKE_BUILD_TYPE=Release \
        -DGGML_NATIVE=OFF

        cmake \
        --build "$HOME/llama.cpp/build" \
        --config Release \
        --target llama-cli \
        --parallel "$(nproc)"

        LLAMA_CLI="$HOME/llama.cpp/build/bin/llama-cli"

        if [ ! -x "$LLAMA_CLI" ]; then
        echo "❌ llama-cli introuvable."

        find "$HOME/llama.cpp/build" \
          -type f \
          -name 'llama-cli*' \
          -print || true

        exit 1
        fi

        echo "LLAMA_CLI=$LLAMA_CLI" >> "$GITHUB_ENV"

        echo
        echo "llama-cli installé :"
        "$LLAMA_CLI" --version

    - name: Download coding model
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p "$HOME/models"

        MODEL_PATH="$HOME/models/qwen.gguf"

        echo "Téléchargement du modèle..."

        curl -fL \
        --retry 3 \
        --retry-all-errors \
        "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true" \
        -o "$MODEL_PATH"

        echo
        echo "Modèle téléchargé :"
        ls -lh "$MODEL_PATH"

    - name: AI repair loop
      env:
        AI_COMMAND: ${{ inputs.command }}
        AI_WORKDIR: ${{ inputs.working-directory }}
      shell: bash
      run: |
        set -euo pipefail

        ERROR_FILE=$(find ai-input -type f -print -quit)

        if [ -z "$ERROR_FILE" ]; then
          echo "❌ Aucun fichier d'erreur trouvé dans ai-input."

        find ai-input \
          -maxdepth 3 \
          -type f \
          -print || true

        exit 1
        fi

        mkdir -p ai-results

        MAX_ATTEMPTS=6
        SUCCESS=0

        for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do

        echo
        echo "========================================"
        echo "AI FIX - TENTATIVE $ATTEMPT/$MAX_ATTEMPTS"
        echo "========================================"
        echo

        if [ "$ATTEMPT" -gt 1 ]; then
          echo "Re-exécution de cargo check..."

          if cd "$AI_WORKDIR" && cargo check > "$GITHUB_WORKSPACE/ai-results/cargo-check-$ATTEMPT.txt" 2>&1; then
            echo "✅ cargo check réussit."

            SUCCESS=1
            break
          fi

          ERROR_FILE="$GITHUB_WORKSPACE/ai-results/cargo-check-$ATTEMPT.txt"
        fi

        echo "Construction du contexte IA..."

        {
          echo "You are an autonomous Rust debugging agent."
          echo
          echo "Your task is to fix a cargo check failure."
          echo
          echo "You MUST return ONLY a valid unified git diff."
          echo
          echo "Do not explain anything."
          echo "Do not use Markdown."
          echo "Do not use code fences."
          echo "Do not invent files."
          echo "Do not modify Cargo.lock unless absolutely necessary."
          echo "Only modify files that are required to fix the compiler error."
          echo
          echo "The patch must be applicable with:"
          echo "git apply ai.patch"
          echo
          echo "COMMAND:"
          printf '%s\n' "$AI_COMMAND"

          echo
          echo "WORKING DIRECTORY:"
          printf '%s\n' "$AI_WORKDIR"

          echo
          echo "CARGO ERROR:"
          cat "$ERROR_FILE"

          echo
          echo "CARGO.TOML:"

          if [ -f "$AI_WORKDIR/Cargo.toml" ]; then
            cat "$AI_WORKDIR/Cargo.toml"
          fi

          echo
          echo "RUST FILES:"

          if [ -d "$AI_WORKDIR/src" ]; then
            find "$AI_WORKDIR/src" \
              -type f \
              -name '*.rs' \
              -print \
              | sort
          fi

          echo
          echo "SOURCE CODE:"

          if [ -d "$AI_WORKDIR/src" ]; then
            while IFS= read -r file; do
              echo
              echo "===== $file ====="
              cat "$file"
            done < <(
              find "$AI_WORKDIR/src" \
                -type f \
                -name '*.rs' \
                -print \
                | sort
            )
          fi

        } > ai-prompt.txt

        echo
        echo "Taille du prompt :"
        wc -c ai-prompt.txt

        echo
        echo "Analyse avec llama.cpp..."

        "$LLAMA_CLI" \
          -m "$HOME/models/qwen.gguf" \
          -p "$(cat ai-prompt.txt)" \
          -n 2048 \
          -c 8192 \
          --temp 0.1 \
          --threads "$(nproc)" \
          > ai-results/model-output-$ATTEMPT.txt \
          2>&1

        echo
        echo "Réponse du modèle :"
        cat ai-results/model-output-$ATTEMPT.txt

        echo
        echo "Extraction du patch..."

        sed \
          -e '/^```diff$/d' \
          -e '/^```$/d' \
          -e '/^Here is.*$/d' \
          -e '/^Here.*patch.*$/d' \
          ai-results/model-output-$ATTEMPT.txt \
          > ai.patch

        if [ ! -s ai.patch ]; then
          echo "❌ Le modèle n'a produit aucun patch."

          continue
        fi

        echo
        echo "Patch proposé :"
        cat ai.patch

        echo
        echo "Vérification du patch..."

        if ! git apply \
          --check \
          ai.patch; then

          echo "❌ Patch invalide."

          continue
        fi

        echo
        echo "Application du patch..."

        git apply ai.patch

        echo
        echo "Fichiers modifiés :"
        git status --short

        echo
        echo "Vérification cargo check..."

        if cd "$AI_WORKDIR" && \
          cargo check > "$GITHUB_WORKSPACE/ai-results/cargo-check-$ATTEMPT.txt" 2>&1; then

          echo
          echo "========================================"
          echo "✅ CORRECTION RÉUSSIE"
          echo "========================================"

          SUCCESS=1
          break
        fi

        echo
        echo "❌ cargo check échoue encore."

        cat "$GITHUB_WORKSPACE/ai-results/cargo-check-$ATTEMPT.txt"

        done

        echo
        echo "========================================"

        if [ "$SUCCESS" -eq 1 ]; then
        echo "✅ AI FIX terminé avec succès."
        else
         echo "❌ AI FIX n'a pas réussi à corriger le projet."
        fi

        echo "========================================"

        {
        echo "===== FINAL GIT DIFF ====="
        git diff

        echo
        echo "===== GIT STATUS ====="
        git status --short
        } > ai-results/final-result.txt

        if [ "$SUCCESS" -ne 1 ]; then
        exit 1
        fi

    - name: Upload AI results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ai-fix-results
        path: |
          ai-results/
          ai.patch
        ai-prompt.txt
      retention-days: 7
