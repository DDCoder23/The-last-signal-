name: Destroy ci-reports history

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Recreate branch
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Crée une branche totalement vide
          git checkout --orphan ci-reports-clean
          git fetch origin
          git switch --orphan ci-reports-clean

          # Vide complètement l'index
          git rm -rf --cached . || true

          # Supprime les fichiers physiques
          git rm -rf . || true
          
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          git clean -fd
          
          # Crée seulement les dossiers rapports
          mkdir -p reports database dashboard

          touch reports/.gitkeep
          touch database/.gitkeep
          touch dashboard/.gitkeep

          git add .
          git commit -m "Empty ci-reports branch"

          git push --force origin ci-reports-clean:ci-reports
