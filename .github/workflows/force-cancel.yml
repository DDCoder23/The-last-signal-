name: Force Cancel Workflow

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  force-cancel:
    runs-on: ubuntu-latest

    steps:
      - name: Force cancel stuck workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "32028944916"
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/force-cancel"
