name: Nightly

on:
  workflow_dispatch:

  schedule:
    - cron: "0 22 * * *"
concurrency:
  group: main-update
  queue: max

permissions:
  actions: write
  contents: write
  security-events: write
  pull-requests: write

jobs:

  launch:
    uses: ./.github/workflows/Launcher.yml
  build:
    needs: launch
    if: >-
     ${{
      always() &&
      (
        needs.launch.result == 'success' ||
        needs.launch.result == 'failure'
      )
     }}
    uses: ./.github/workflows/build.yml

  

  security:
    needs: launch
    uses: ./.github/workflows/security.yml

  

  
  
