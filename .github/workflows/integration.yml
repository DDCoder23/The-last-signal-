name: Integration Tests

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
  workflow_call:

  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:

  integration:

    name: Python ↔ Rust Integration

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

    ##########################################################
    # Checkout
    ##########################################################

    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Restore previous database and logs
      run: |
             git fetch origin ci-database
             git checkout origin/ci-database -- database/ || true
             git checkout origin/ci-database -- logs/ || true
             echo "=== Restored ==="
             ls -lah database || true
             ls -lah logs || true
    
    
      
    
    

    ##########################################################
    # Python
    ##########################################################
    - name: Read current Python version
      id: current
      run: |
        echo "version=$(cat .python-version)" >> $GITHUB_OUTPUT
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.current.outputs.version }}
        cache: "pip"
        check-latest: ${{ github.workflow == 'Nightly' }}
    - name: Get Python version
      id: python-version
      run: |
               python --version
    - name: Update Python version
      if: github.workflow == 'Nightly'
      run: |
             VERSION=$(python --version | awk '{print $2}')
             echo "$VERSION" > .python-version
             if [ "$(cat .python-version)" != "$VERSION" ]; then
             echo "$VERSION" > .python-version
             echo "Updated Python version to $VERSION"
             else
             echo "No update needed"
             fi
             git config user.name github-actions
             git config user.email github-actions@github.com
             

             git add .python-version

             git diff --cached --quiet || git commit -m "chore: update Python version"

             git push
        

    - name: Install Python dependencies
      run: |

        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        pip install pytest

    ##########################################################
    # Rust
    ##########################################################

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    ##########################################################
    # Build server
    ##########################################################

    - name: Build Rust server
      working-directory: server_rust
      run: cargo build --release

    ##########################################################
    # Start server
    ##########################################################

    - name: Start Rust server
      working-directory: server_rust
      run: |

        cargo run --release > server.log 2>&1 &

        echo $! > server.pid

        sleep 5

    ##########################################################
    # Vérifie que le serveur est lancé
    ##########################################################

    - name: Check server
      run: |

        if ps -p $(cat server_rust/server.pid) > /dev/null
        then
          echo "Server running"
        else
          echo "Server crashed"

          cat server_rust/server.log

          exit 1
        fi

    ##########################################################
    # Tests Python
    ##########################################################

    - name: Run integration tests
      run: |

        pytest tests/ -v -s
        

    ##########################################################
# Stop server
##########################################################

    
    - name: Stop server
      if: always()
      run: |
              if [ -f server_rust/server.pid ]; then
              PID=$(cat server_rust/server.pid)
              if ps -p "$PID" > /dev/null; then
              echo "Stopping server (PID=$PID)..."

              kill -SIGTERM "$PID"

              # Attendre jusqu'à 15 secondes
              for i in $(seq 1 15); do
              if ! ps -p "$PID" > /dev/null; then
              echo "Server stopped."
              break
              fi
              sleep 1
              done

              # Toujours vivant ? On force.
              if ps -p "$PID" > /dev/null; then
              echo "Server did not stop gracefully, forcing shutdown..."
              kill -SIGKILL "$PID"
              sleep 2
              fi
              fi
              fi
              rm -f server_rust/server.pid

    ##########################################################
    # Upload log
    ##########################################################
    - name: Check generated files
      run: |
             echo "=== DATABASE ==="
             ls -lah database
             echo "=== LOG FILE ==="
             ls -lah logs
             stat logs/the_last_signal.log
             tail -20 logs/the_last_signal.log

             
    - name: Upload server log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: logs/
    - name: Inspect database
      run: |
             python << 'EOF'
             import sqlite3

             DB_PATH = "database/client_logs"
             conn = sqlite3.connect(DB_PATH)
             cursor = conn.cursor()

             cursor.execute("SELECT name FROM sqlite_master WHERE type='table';")
             tables = cursor.fetchall()
             print(f"Nombre de tables : {len(tables)}")
             for (table_name,) in tables:
                 print("=" * 60)
                 print(table_name)
                 cursor.execute(f'PRAGMA table_info("{table_name}")')
                 print(cursor.fetchall())
                 cursor.execute(f'SELECT * FROM "{table_name}"')
                 print(cursor.fetchall())
             conn.close()
             EOF
  # ==========================================================
# Commit automatique des bases SQLite
# ========================================================
    - name: Commit databases and logs
      if: always()
      run: | 
             set -e
             git config --global user.name "github-actions"
             git config --global user.email "github-actions@github.com"
             git status
             git fetch origin
             rm -rf ../ci-database
             if git ls-remote --exit-code --heads origin ci-database >/dev/null; then
             git worktree add ../ci-database ci-database
             else
             git worktree add --detach ../ci-database
             cd ../ci-database
             git checkout --orphan ci-database
             cd -
             fi
             mkdir -p ../ci-database/database
             mkdir -p ../ci-database/logs
             cp -R database/. ../ci-database/database/ 2>/dev/null || true
             cp -R logs/. ../ci-database/logs/ 2>/dev/null || true
             cd ../ci-database
             git add -A database logs
             if git diff --cached --quiet; then
             echo "No changes."
             else
             git commit -m "Update CI artifacts #${GITHUB_RUN_NUMBER}"
             git push origin ci-database
             fi
             cd -
             git worktree remove ../ci-database --force

             
