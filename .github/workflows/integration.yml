name: Integration Tests

on:
  
  workflow_call:
    secrets:
      VAULT_KEY:
        required: true
    inputs:
       commit-message:
          description: Message du commit
          required: false
          type: string
          default: "Update CI artifacts #${GITHUB_RUN_NUMBER}"
       branch:
         description: Branche de destination
         required: false
         type: string
         default: ci-database 

  

permissions:
  contents: write
  pull-requests: write

jobs:

  integration:

    name: Python ↔ Rust Integration

    runs-on: ubuntu-latest
    
    env:
      
      GH_TOKEN: ${{ github.token }}
      VAULT_KEY: ${{ secrets.VAULT_KEY }}
      DATABASE_PATH: ${{ github.workspace }}/database
      DATABASE_URL: sqlite:${{ github.workspace }}/database/the_last_signal.db
  
    timeout-minutes: 20

    steps:

    ##########################################################
    # Checkout
    ##########################################################

    - name: Checkout repository
      uses: actions/checkout@v4
    
    
    
      
    
    

    ##########################################################
    # Python
    ##########################################################
    - name: Read current Python version
      id: current
      run: |
        echo "version=$(cat .python-version)" >> $GITHUB_OUTPUT
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.current.outputs.version }}
        check-latest: ${{ github.workflow == 'Nightly' }}
    - name: Get Python version
      id: python-version
      run: |
               python --version
    - name: Update Python version
      if: github.workflow == 'Nightly'
      run: |
             VERSION=$(python --version | awk '{print $2}')
             echo "$VERSION" > .python-version
             if [ "$(cat .python-version)" != "$VERSION" ]; then
             echo "$VERSION" > .python-version
             echo "Updated Python version to $VERSION"
             else
             echo "No update needed"
             fi
             git config user.name github-actions
             git config user.email github-actions@github.com
             

             git add .python-version

             git diff --cached --quiet || git commit -m "chore: update Python version"
             git pull --rebase origin main
             
             git push origin main
        

    - name: Install Python dependencies
      run: |

        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        pip install pytest

    ##########################################################
    # Rust
    ##########################################################

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install Rust nightly
      if: github.workflow == 'Nightly'
      uses: dtolnay/rust-toolchain@nightly

    - name: Install cargo-udeps
      if: github.workflow == 'Nightly'
      run: cargo +nightly install cargo-udeps --locked

    - name: Check unused dependencies
      if: github.workflow == 'Nightly'
      working-directory: server_rust
      run: cargo +nightly udeps --all-targets -v
    
    - name: Debug environment
      run: |
        mkdir -p database
        echo "DATABASE_URL=$DATABASE_URL"
    - name: Check VAULT_KEY
      run: |
             echo "VAULT_KEY présente : ${VAULT_KEY:+oui}"
             echo "Longueur : ${#VAULT_KEY}"
             printf '%s' "$VAULT_KEY" | base64 -d > /dev/null && echo "Base64 valide" || echo "Base64 invalide"
    
              

    ##########################################################
    # Build server
    ##########################################################

    - name: Build Rust server
      working-directory: server_rust
      run: cargo build --release

    ##########################################################
    # Start server
    ##########################################################

    - name: Start Rust server
      working-directory: server_rust
      run: |

        cargo run --release > server.log 2>&1 &

        echo $! > server.pid

        sleep 45

    ##########################################################
    # Vérifie que le serveur est lancé
    ##########################################################

    - name: Check server
      run: |

        if ps -p $(cat server_rust/server.pid) > /dev/null
        then
          echo "Server running"
        else
          echo "Server crashed"

          cat server_rust/server.log

          exit 1
        fi
    

    ##########################################################
    # Tests Python
    ##########################################################

    - name: Run integration tests
      run: |

        pytest tests/ -v -s
        

    ##########################################################
# Stop server
##########################################################

    
    - name: Stop server
      if: always()
      run: |
              if [ -f server_rust/server.pid ]; then
              PID=$(cat server_rust/server.pid)
              if ps -p "$PID" > /dev/null; then
              echo "Stopping server (PID=$PID)..."

              kill -SIGTERM "$PID"

              # Attendre jusqu'à 15 secondes
              for i in $(seq 1 15); do
              if ! ps -p "$PID" > /dev/null; then
              echo "Server stopped."
              break
              fi
              sleep 1
              done

              # Toujours vivant ? On force.
              if ps -p "$PID" > /dev/null; then
              echo "Server did not stop gracefully, forcing shutdown..."
              kill -SIGKILL "$PID"
              sleep 2
              fi
              fi
              fi
              rm -f server_rust/server.pid

    ##########################################################
    # Upload log
    ##########################################################
    - name: Check generated files
      continue-on-error: true
      run: |
             
             echo "=== LOG FILE ==="
             ls -lah logs
             stat logs/the_last_signal.log
             tail -20 logs/the_last_signal.log

             
    - name: Upload server log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: logs/
    - name: Inspect SQLite database
      run: |
            echo "PWD=$(pwd)"
            find . -name "*.db" -type f -ls
            find . -name "echecs_loot.json"
            echo "-----"
            cat ./server_rust/echecs_loot.json
            echo "----"
            cat ./echecs_loot.json
            python scripts/voir_database.py database/the_last_signal.db
    
  
    
  # ==========================================================
# Commit automatique des bases SQLite
# ========================================================
    - name: Commit databases and logs
      if: always()
      run: | 
             set -e
             git config --global user.name "github-actions"
             git config --global user.email "github-actions@github.com"
             git status
             git fetch origin
             git rm -f logs/.gitkeep logs/the_last_signal.log
             rm -rf ../ci-database
             if git ls-remote --exit-code --heads origin ci-database >/dev/null; then
             git worktree add ../ci-database ci-database
             else
             git worktree add --detach ../ci-database
             cd ../ci-database
             git checkout --orphan ci-database
             cd -
             fi
             mkdir -p ../ci-database/database
             mkdir -p ../ci-database/logs
             cp -R database/. ../ci-database/database/ 2>/dev/null || true
             cp -R logs/. ../ci-database/logs/ 2>/dev/null || true
             cd ../ci-database
             git add  database logs
             if git diff --cached --quiet; then
             echo "No changes."
             else
             git commit -m "Update CI artifacts #${GITHUB_RUN_NUMBER}"

             for i in 1 2 3
             do
             echo "Tentative $i/3"
             git fetch origin "${{ inputs.branch }}"

             if ! git rebase "origin/${{ inputs.branch }}"
             then
             echo "Rebase impossible."
             git rebase --abort || true
             break
             fi

             echo "Branche actuelle :"
             git branch --show-current

             git status

             if git push origin HEAD:${{ inputs.branch }}
             then
             echo "Push réussi"

             cd "$GITHUB_WORKSPACE"
             git worktree remove ../ci-database --force
             exit 0
             fi

             echo "Push échoué."
             sleep 2
             done

             echo "======================================"
             echo "Push direct impossible"
             echo "Création de la branche de secours"
             echo "======================================"

             FALLBACK_BRANCH="${{ inputs.branch }}-update"

             echo "Branche de secours : $FALLBACK_BRANCH"

             # Crée ou met à jour la branche de secours
             git push --force origin HEAD:"refs/heads/$FALLBACK_BRANCH"
             

             echo "Branche de secours poussée."

             # Vérifie si une PR existe déjà
             PR_URL=$(gh pr list \
             --base "${{ inputs.branch }}" \
             --head "$FALLBACK_BRANCH" \
             --state open \
             --json url \
             --jq '.[0].url')

             if [ -n "$PR_URL" ]; then
             echo "Une Pull Request existe déjà : $PR_URL"
             else
             echo "Création de la Pull Request..."

             gh pr create \
              --base "${{ inputs.branch }}" \
              --head "$FALLBACK_BRANCH" \
              --title "${{ inputs.commit-message }}" \
              --body "Le push direct vers \`${{ inputs.branch }}\` a échoué après 3 tentatives. Les changements générés par GitHub Actions sont disponibles dans cette Pull Request."
             fi

             cd "$GITHUB_WORKSPACE"
             git worktree remove ../ci-database --force
             fi
