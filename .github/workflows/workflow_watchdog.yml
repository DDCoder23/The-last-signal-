name: Workflow Watchdog

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

  workflow_run:
    workflows:
      - "Python CI Report"
      - "Integration"
      - "Documentation Quality"
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: write
  contents: read

env:
  MAX_RUNTIME_MINUTES: 120
  MAX_QUEUE_MINUTES: 60
  WATCHDOG_NAME: "Workflow Watchdog"

jobs:
  watchdog:
    name: Monitor GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Check workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "       WORKFLOW WATCHDOG"
          echo "========================================"

          echo "Repository : ${GITHUB_REPOSITORY}"
          echo "Date       : $(date -u)"
          echo "Max runtime: ${MAX_RUNTIME_MINUTES} min"
          echo "Max queue  : ${MAX_QUEUE_MINUTES} min"
          echo

          NOW=$(date +%s)

          # ==========================================================
          # WORKFLOWS EN COURS D'EXÉCUTION
          # ==========================================================

          echo "Recherche des workflows en cours..."

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?status=in_progress&per_page=100" \
            > /tmp/running.json

          jq -c '.workflow_runs[]' /tmp/running.json |
          while IFS= read -r RUN; do

            RUN_ID=$(echo "$RUN" | jq -r '.id')
            NAME=$(echo "$RUN" | jq -r '.name')
            STARTED=$(echo "$RUN" | jq -r '.run_started_at')

            # Ne jamais surveiller le watchdog lui-même
            if [ "$NAME" = "$WATCHDOG_NAME" ]; then
              continue
            fi

            STARTED_TS=$(date -d "$STARTED" +%s)
            AGE=$((NOW - STARTED_TS))
            AGE_MIN=$((AGE / 60))

            echo "[RUNNING] $NAME"
            echo "          ID      : $RUN_ID"
            echo "          durée   : ${AGE_MIN} min"

            if [ "$AGE_MIN" -ge "$MAX_RUNTIME_MINUTES" ]; then

              echo "          ⚠️ Durée maximale dépassée."
              echo "          → FORCE-CANCEL"

              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/force-cancel"

              echo "          ✅ Force-cancel demandé."

            else

              echo "          → OK"

            fi

            echo

          done

          # ==========================================================
          # WORKFLOWS EN FILE D'ATTENTE
          # ==========================================================

          echo "Recherche des workflows en attente..."

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=100" \
            > /tmp/queued.json

          jq -c '.workflow_runs[]' /tmp/queued.json |
          while IFS= read -r RUN; do

            RUN_ID=$(echo "$RUN" | jq -r '.id')
            NAME=$(echo "$RUN" | jq -r '.name')
            CREATED=$(echo "$RUN" | jq -r '.created_at')

            if [ "$NAME" = "$WATCHDOG_NAME" ]; then
              continue
            fi

            CREATED_TS=$(date -d "$CREATED" +%s)
            AGE=$((NOW - CREATED_TS))
            AGE_MIN=$((AGE / 60))

            echo "[QUEUED] $NAME"
            echo "         ID       : $RUN_ID"
            echo "         attente  : ${AGE_MIN} min"

            if [ "$AGE_MIN" -ge "$MAX_QUEUE_MINUTES" ]; then

              echo "         ⚠️ Attente maximale dépassée."
              echo "         → CANCEL"

              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel"

              echo "         ✅ Annulation demandée."

            else

              echo "         → OK"

            fi

            echo

          done

          echo "========================================"
          echo "Surveillance terminée."
          echo "========================================"
