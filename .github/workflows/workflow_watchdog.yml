name: Workflow Watchdog

on:
  workflow_dispatch:

  schedule:
    # Vérification toutes les 5 minutes
    - cron: "*/5 * * * *"

  workflow_run:
    workflows:
      - "launcher"
      - "Security Report"
      - "Nightly"
    
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: write
  contents: read

env:
  # Temps maximum d'exécution RÉELLE.
  # Le temps passé en queued/pending n'est pas compté.
  MAX_RUNTIME_MINUTES: 120

  WATCHDOG_NAME: "Workflow Watchdog"

jobs:
  watchdog:
    name: Monitor GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Check running workflows
        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash

        run: |
          set -euo pipefail

          echo "========================================"
          echo "       WORKFLOW WATCHDOG"
          echo "========================================"

          echo "Repository : ${GITHUB_REPOSITORY}"
          echo "Date       : $(date -u)"
          echo "Max runtime: ${MAX_RUNTIME_MINUTES} min"
          echo

          NOW=$(date +%s)

          # ==========================================================
          # RÉCUPÉRATION DES WORKFLOWS EN COURS
          # ==========================================================

          echo "Recherche des workflows en cours..."
          echo

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?status=in_progress&per_page=100" \
            > /tmp/running.json

          # ==========================================================
          # ANALYSE
          # ==========================================================

          jq -c '.workflow_runs[]' /tmp/running.json |
          while IFS= read -r RUN; do

            RUN_ID=$(echo "$RUN" | jq -r '.id')
            NAME=$(echo "$RUN" | jq -r '.name')

            CREATED=$(echo "$RUN" | jq -r '.created_at')
            STARTED=$(echo "$RUN" | jq -r '.run_started_at')

            # ------------------------------------------------------
            # Ne jamais surveiller le watchdog lui-même
            # ------------------------------------------------------

            if [ "$NAME" = "$WATCHDOG_NAME" ]; then
              continue
            fi

            # ------------------------------------------------------
            # Vérification des timestamps
            # ------------------------------------------------------

            if [ "$STARTED" = "null" ] || [ -z "$STARTED" ]; then
              echo "[SKIP] $NAME"
              echo "       ID : $RUN_ID"
              echo "       Aucun run_started_at disponible."
              echo
              continue
            fi

            CREATED_TS=$(date -d "$CREATED" +%s)
            STARTED_TS=$(date -d "$STARTED" +%s)

            TOTAL_AGE=$((NOW - CREATED_TS))
            RUNTIME=$((NOW - STARTED_TS))

            TOTAL_MIN=$((TOTAL_AGE / 60))
            RUNTIME_MIN=$((RUNTIME / 60))

            # ------------------------------------------------------
            # AFFICHAGE
            # ------------------------------------------------------

            echo "[RUNNING] $NAME"
            echo "          ID          : $RUN_ID"
            echo "          créé depuis : ${TOTAL_MIN} min"
            echo "          exécuté     : ${RUNTIME_MIN} min"
            echo "          created_at  : $CREATED"
            echo "          started_at  : $STARTED"

            # ------------------------------------------------------
            # Protection contre un timestamp incohérent
            # ------------------------------------------------------

            if [ "$RUNTIME" -lt 0 ]; then
              echo "          ⚠️ Timestamp incohérent."
              echo
              continue
            fi

            # ------------------------------------------------------
            # Vérification du temps d'exécution RÉEL
            # ------------------------------------------------------

            if [ "$RUNTIME_MIN" -ge "$MAX_RUNTIME_MINUTES" ]; then

              echo
              echo "          ⚠️ Temps d'exécution maximal dépassé."
              echo "          → FORCE-CANCEL"

              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/force-cancel"

              echo "          ✅ Force-cancel demandé."

            else

              REMAINING=$((MAX_RUNTIME_MINUTES - RUNTIME_MIN))

              echo "          → OK"
              echo "          → marge restante : ${REMAINING} min"

            fi

            echo

          done

          # ==========================================================
          # IMPORTANT
          # ==========================================================
          #
          # Les workflows queued/pending ne sont volontairement PAS
          # annulés.
          #
          # Ton dépôt utilise :
          #
          #   concurrency:
          #     group: main-update
          #     queue: max
          #
          # Un workflow peut donc rester pending volontairement.
          #
          # ==========================================================

          echo "Les workflows queued/pending sont ignorés."
          echo
          echo "========================================"
          echo "Surveillance terminée."
          echo "========================================"
