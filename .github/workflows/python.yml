name: Python CI Report

on:
  workflow_call:



permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:

  python-check:

    name: Python Tests & Report
    runs-on: ubuntu-latest


    steps:
      # Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
              fetch-depth: 0
              token: ${{ secrets.GITHUB_TOKEN }}
              persist-credentials: true


      # Installation Python
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          


      # Installation des outils
      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip setuptools wheel

          

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          



      # Création du fichier rapport
      - name: Create report
        run: |
          mkdir -p reports/python
          LAST=$(find reports/python -type f -name 'python-report-*.md' \
          -printf '%f\n' |
           sed -E 's/python-report-([0-9]+)\.md/\1/' |
           sort -n |
           tail -1)

          REPORT_NUMBER=$(( ${LAST:-0} + 1 ))

          REPORT="reports/python/python-report-${REPORT_NUMBER}.md"
         

          echo "REPORT=$REPORT" >> $GITHUB_ENV

          {
            echo "# 🐍 Python CI Report"
            echo ""
            echo "Run : ${GITHUB_RUN_NUMBER}"
            echo "Branch : ${GITHUB_REF_NAME}"
            echo "Commit : ${GITHUB_SHA}"
            echo "Date : $(date)"
            echo ""
            echo "---"
            echo ""
            echo "# 📊 Summary"
            echo ""
            } > "$REPORT"

          

          

          



      # Vérification du formatage
      - name: Check formatting
        continue-on-error: true
        run: |

                 echo "## ⚫ Black" >> "$REPORT"

                 black --check . > black.txt 2>&1 || true

                 COUNT=$(grep -c "would reformat" black.txt)

                 echo "" >> "$REPORT"
                 echo "**Files to reformat:** $COUNT" >> "$REPORT"
                 echo "" >> "$REPORT"

                 echo "<details>" >> "$REPORT"
                 echo "<summary>Show files</summary>" >> "$REPORT"

                 grep "would reformat" black.txt \
                 | sed 's/would reformat //' \
                 >> "$REPORT"

                 echo "</details>" >> "$REPORT"
                 echo "" >> "$REPORT"



      # Analyse du code
      - name: Code analysis
        continue-on-error: true
        run: |
          pwd
          ls -la docs
          test -f docs/QRB_flake8_error.md && echo "FOUND" || echo "MISSING"

          echo "##   Flake8" >> "$REPORT"
          echo "" >> "$REPORT"
          flake8 . > flake8.txt 2>&1 || true
          echo "### 📊 Erreurs par code" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "| Code | Nombre |" >> "$REPORT"
          echo "|------|-------:|" >> "$REPORT"

          awk -F: '{gsub(/^ +/, "", $4); print $4}' flake8.txt \
          | awk '{print $1}' \
          | sort \
          | uniq -c \
          | sort -rn \
          | while read count code
          do
             echo "| $code | $count |"
          done >> "$REPORT"
          echo "" >> "$REPORT"
        
          echo "" >> "$REPORT"
          echo "<details>" >> "$REPORT"
          echo "<summary>📋 Voir toutes les erreurs Flake8</summary>" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "| Fichier | Ligne | Code | Message |" >> "$REPORT"
          echo "|---------|------:|------|---------|" >> "$REPORT"

          awk -F: '
          {
           file=$1
           line=$2

           gsub(/^ +/, "", $4)
           split($4,a," ")

           code=a[1]
           msg=$4
           sub(code" ","",msg)

          printf("| %s | %s | %s | %s |\n",
             file,
             line,
             code,
             msg)
           }
           ' flake8.txt >> "$REPORT"

          echo "" >> "$REPORT"
          echo "</details>" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "###   📂 Top 10 des fichiers avec le plus d'erreurs" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "| Rang | Fichier | Erreurs |" >> "$REPORT"
          echo "|----:|---------|--------:|" >> "$REPORT"

          awk -F: '{print $1}' flake8.txt \
          | sort | uniq -c | sort -rn \
          | head -10 | awk '{
          printf("| %d | %s | %d |\n", NR, $2, $1)
          }' >> "$REPORT"
          echo "> 💡 Vous ne connaissez pas une erreur Flake8 ?" >> "$REPORT"
          echo ">" >> "$REPORT"
          echo "> Consultez le guide complet :" >> "$REPORT"
          echo "> [📘 Guide Flake8](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/QRB_flake8_error.md)" >> "$REPORT"
          echo "" >> "$REPORT"


      - name: Quality analysis
        continue-on-error: true
        run: |

              echo "## 🧠 Complexity (Radon)" >> "$REPORT"
              radon cc . -a > radon.txt 2>&1 || true

              AVG=$(grep "Average complexity" radon.txt | awk -F: '{print $2}')

              echo "" >> "$REPORT"
              echo "**Average complexity:** ${AVG:-Unknown}" >> "$REPORT"
              echo "" >> "$REPORT"

              echo "<details>" >> "$REPORT"
              echo "<summary>Show complexity report</summary>" >> "$REPORT"
              echo "" >> "$REPORT"

              cat radon.txt >> "$REPORT"

              echo "" >> "$REPORT"
              echo "</details>" >> "$REPORT"
              echo "" >> "$REPORT"
              echo "## 🔒 Security (Bandit)" >> "$REPORT"

              bandit -r . -f txt > bandit.txt 2>&1 || true

              HIGH=$(grep -c "Severity: High" bandit.txt || true)
              MEDIUM=$(grep -c "Severity: Medium" bandit.txt || true)
              LOW=$(grep -c "Severity: Low" bandit.txt || true)

              echo "" >> "$REPORT"
              echo "| Severity | Count |" >> "$REPORT"
              echo "|----------|------:|" >> "$REPORT"
              echo "| High | $HIGH |" >> "$REPORT"
              echo "| Medium | $MEDIUM |" >> "$REPORT"
              echo "| Low | $LOW |" >> "$REPORT"

              echo "" >> "$REPORT"

              echo "<details>" >> "$REPORT"
              echo "<summary>Show Bandit report</summary>" >> "$REPORT"
              echo "" >> "$REPORT"

              cat bandit.txt >> "$REPORT"

              echo "" >> "$REPORT"
              echo "</details>" >> "$REPORT"
              echo "" >> "$REPORT"
              echo "##  📏 Pylint" >> "$REPORT"

              pylint . > pylint.txt 2>&1 || true

              SCORE=$(grep "Your code has been rated at" pylint.txt | awk '{print $7}')

              echo "" >> "$REPORT"
              echo "**Global score:** ${SCORE:-Unknown}" >> "$REPORT"
              echo "" >> "$REPORT"

              echo "<details>" >> "$REPORT"
              echo "<summary>Show Pylint report</summary>" >> "$REPORT"
              echo "" >> "$REPORT"

              cat pylint.txt >> "$REPORT"

              echo "" >> "$REPORT"
              echo "</details>" >> "$REPORT"
              echo "" >> "$REPORT"
              echo "##  📈 Coverage" >> "$REPORT"

              pytest --cov=. --cov-report=term > coverage.txt 2>&1 || true

              COVERAGE=$(grep TOTAL coverage.txt | awk '{print $NF}')

              echo "" >> "$REPORT"
              echo "**Coverage:** ${COVERAGE:-0%}" >> "$REPORT"

              echo "" >> "$REPORT"

              echo "<details>" >> "$REPORT"
              echo "<summary>Show coverage report</summary>" >> "$REPORT"
              echo "" >> "$REPORT"

              cat coverage.txt >> "$REPORT"

              echo "" >> "$REPORT"
              echo "</details>">> "$REPORT"
              echo "" >> "$REPORT"


      
    
              
            

               




      

      - name: Display report

        run: |

          cat "$REPORT" >> $GITHUB_STEP_SUMMARY



      




      
             
      
      - name: 💾 Commit reports
        run: |
                git config --global user.name "github-actions"
                git config --global user.email "github-actions@github.com"
                export GH_TOKEN="${{ github.token }}"
                git fetch origin
                if git show-ref --verify --quiet refs/remotes/origin/ci-reports
                then
                git worktree add /tmp/ci-worktree origin/ci-reports
                else
                git worktree add -b ci-reports/tmp/ci-worktree
                fi
                mkdir -p "/tmp/ci-worktree/reports"
                cp -r reports/python/* "/tmp/ci-worktree/reports/" 2>/dev/null || true
                cd /tmp/ci-worktree
                git add .
                git status
                if git diff --cached --quiet; then
                echo "No changes to commit."
                cd "$GITHUB_WORKSPACE"
                git worktree remove /tmp/ci-worktree --force
                exit 0
                fi
                git commit -m "Report python n° ${{ REPORT_NUMBER}}"
                for i in 1 2 3
                do
                echo "Tentative $i/3"
                git fetch origin ci-reports
                echo "Branche actuelle :"
                git branch --show-current

                git status

                if git push origin HEAD:ci-reports
                then
                echo "Push réussi"
                cd "$GITHUB_WORKSPACE"
                git worktree remove /tmp/ci-worktree --force
                exit 0
                fi

                echo "Push échoué."
                sleep 2
                done

                echo "======================================"
                echo "Push direct impossible"
                echo "Création de la branche de secours"
                echo "======================================"

                FALLBACK_BRANCH="ci-reports-update"
                echo "Branche de secours : $FALLBACK_BRANCH"

                # Crée ou met à jour la branche de secours
                git push --force origin HEAD:"refs/heads/$FALLBACK_BRANCH"
                echo "Branche de secours poussée."

                # Vérifie si une PR existe déjà
                PR_URL=$(gh pr list \
                --base "ci-reports" \
                --head "$FALLBACK_BRANCH" \
                --state open \
                --json url \
                --jq '.[0].url')
                if [ -n "$PR_URL" ]; then
                echo "Une Pull Request existe déjà : $PR_URL"
                else
                echo "Création de la Pull Request..."

                gh pr create \
                --base "${{ inputs.branch }}" \
                --head "$FALLBACK_BRANCH" \
                --title "${{ inputs.commit-message }}" \
                --body "Le push direct vers \`${{ inputs.branch }}\` a échoué après 3 tentatives. Les changements générés par GitHub Actions sont     disponibles dans cette Pull Request."
                fi

                cd "$GITHUB_WORKSPACE"
                git worktree remove /tmp/ci-worktree --force
        
           


      
